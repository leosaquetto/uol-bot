name: TEMP - copiar secrets Telegram para Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-workers/uol-telegram-shadow-worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-workers/uol-telegram-shadow-worker/package-lock.json

      - name: instalar Wrangler
        run: npm ci

      - name: copiar secrets sem exibir valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UOL_CF_TEMP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c90296275f6632c82ba519a88b349211
          CF_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CF_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_CANAL2_ID: ${{ secrets.CANAL2_ID }}
          CF_GRUPO_COMENTARIO_ID: ${{ secrets.GRUPO_COMENTARIO_ID }}
        run: |
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          jq -n \
            --arg telegram_token "$CF_TELEGRAM_TOKEN" \
            --arg telegram_chat_id "$CF_TELEGRAM_CHAT_ID" \
            --arg canal2_id "$CF_CANAL2_ID" \
            --arg grupo_comentario_id "$CF_GRUPO_COMENTARIO_ID" \
            '{
              TELEGRAM_TOKEN: $telegram_token,
              TELEGRAM_CHAT_ID: $telegram_chat_id,
              CANAL2_ID: $canal2_id,
              GRUPO_COMENTARIO_ID: $grupo_comentario_id
            }' > "$secret_file"
          npx wrangler secret bulk "$secret_file"
