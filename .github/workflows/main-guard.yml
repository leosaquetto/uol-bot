name: Main guard

# Detecta merge no main sem CI verde (de qualquer agente ou pessoa) e avisa pelo saquettoOS.
# Criado em 14/11/2026 depois de um merge com CI vermelho. Não bloqueia: o plano grátis não tem proteção de branch
# em repositório privado. Prevenção fica no `safe-merge` (~/.local/bin) e no hook do Claude Code.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir CI do PR mesclado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          NTFY_SERVER: ${{ secrets.SAQUETTOOS_NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.SAQUETTOOS_NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.SAQUETTOOS_NTFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request
          repo, sha = os.environ['REPO'], os.environ['SHA']
          def api(path):
              out = subprocess.run(['gh', 'api', '-H', 'Accept: application/vnd.github+json', path], capture_output=True, text=True, check=True).stdout
              return json.loads(out)
          # Logo após o squash a API ainda pode não ligar o commit ao PR (17/11, #154:
          # merge 15:32:08Z, guard 15:32:14Z, alarme falso). Tenta por ~60 s antes de concluir.
          for attempt in range(7):
              prs = [p for p in api(f'repos/{repo}/commits/{sha}/pulls') if p.get('merged_at')]
              if prs:
                  break
              if attempt < 6:
                  time.sleep(10)
          problems = []
          if not prs:
              problems.append(f'commit {sha[:7]} entrou no main sem PR mesclado')
          for pr in prs:
              head = pr['head']['sha']
              runs = api(f'repos/{repo}/commits/{head}/check-runs?per_page=100')['check_runs']
              runs = [r for r in runs if r['name'] != 'audit']
              bad = [f"{r['name']}={r['conclusion'] or r['status']}" for r in runs
                     if r['status'] != 'completed' or r['conclusion'] not in ('success', 'skipped', 'neutral')]
              if bad:
                  problems.append(f"PR #{pr['number']} mesclado com CI não verde: {', '.join(bad)}")
          print(json.dumps({'sha': sha, 'problems': problems}))
          if problems and os.environ.get('NTFY_TOPIC'):
              title = f'Main sem CI verde: {repo.split("/")[1]}'
              body = '\n'.join(problems) + f'\nhttps://github.com/{repo}/commit/{sha}'
              envelope = {'id': f'main-guard-{repo.split("/")[1]}-{sha[:12]}', 'source': 'saquettoos', 'title': title,
                          'body': body[:3800], 'route': 'saquettoOS://home'}
              payload = {'topic': os.environ['NTFY_TOPIC'], 'title': title, 'priority': 4,
                         'message': json.dumps(envelope, ensure_ascii=False, separators=(',', ':'))}
              server = (os.environ.get('NTFY_SERVER') or 'https://ntfy.sh').rstrip('/') + '/'
              headers = {'Content-Type': 'application/json'}
              if os.environ.get('NTFY_TOKEN'):
                  headers['Authorization'] = 'Bearer ' + os.environ['NTFY_TOKEN']
              req = urllib.request.Request(server, data=json.dumps(payload).encode(), method='POST', headers=headers)
              urllib.request.urlopen(req, timeout=20).read()
          if problems:
              raise SystemExit(1)
          PY
