name: UOL Worker Ready Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uol-worker-ready-monitor
  cancel-in-progress: false

jobs:
  readiness:
    name: Verificar readiness
    if: github.event_name == 'workflow_dispatch' || vars.UOL_READY_MONITOR_ENABLED != 'false'
    runs-on: [self-hosted, linux, box2]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Executar monitor headless sem falha ruidosa
        working-directory: cloudflare-workers/uol-telegram-shadow-worker
        env:
          READY_URL: https://uol-telegram-shadow-pilot.leosaquetto.workers.dev/readyz
          BEEPER_READY_URL: https://163-176-194-58.sslip.io/readyz/uol
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Box II only reaches the internet through its local proxy; Node's
          # fetch honours https_proxy only with this flag.
          NODE_USE_ENV_PROXY: "1"
        run: node scripts/monitor-ready.mjs
