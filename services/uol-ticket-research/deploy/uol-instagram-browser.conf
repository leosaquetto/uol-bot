# Optional drop-in: /etc/systemd/system/uol-instagram-monitor.service.d/browser.conf
# Only needed when config.json enables browserGateFallback. Existing isolation
# and the primary HTML/push-only collector stay unchanged.
[Service]
Environment=UOL_INSTAGRAM_CHROMIUM_PATH=/usr/bin/google-chrome
MemoryHigh=192M
MemoryMax=384M
TasksMax=128
